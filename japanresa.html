<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Japan resa 2026</title>
<meta name="description" content="Japanresa 1–14 november 2026 — Tokyo, Kanazawa, Kyoto, Wazuka och Hakone.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%81%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0a09;
    --paper:#f7f4ee;
    --dim:rgba(247,244,238,.72);
    --vermilion:#d1553f;
    --gap:clamp(4px,.55vw,9px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ---------- Stage: hela sidan är en länk ---------- */
  .stage{
    position:relative;
    display:block;
    height:100dvh;
    min-height:100vh;
    overflow:hidden;
    text-decoration:none;
    color:inherit;
    background:var(--ink);
    cursor:pointer;
  }

  /* ---------- Bildkollage ---------- */
  .mosaic{
    position:absolute; inset:0;
    display:grid;
    gap:var(--gap);
    padding:var(--gap);
    grid-template-columns:repeat(6,1fr);
    grid-template-rows:repeat(4,1fr);
    grid-template-areas:
      "a a b c c d"
      "a a b e e d"
      "f f g e e h"
      "i i g j j h";
  }
  .tile{
    position:relative;
    overflow:hidden;
    border-radius:4px;
    margin:0;
    background:#17130f;
    opacity:0;
    animation:tileIn 1.1s cubic-bezier(.2,.75,.3,1) both;
  }
  .tile img{
    width:100%; height:100%;
    display:block;
    object-fit:cover;
    transform:scale(1.09);
    filter:saturate(.92) contrast(1.05) brightness(.88);
    transition:filter 1.4s ease;
    animation:driftA 34s ease-in-out infinite alternate;
    will-change:transform;
  }
  .tile:nth-child(even) img{animation-name:driftB; animation-duration:42s;}
  .tile:nth-child(3n) img{animation-duration:48s;}
  .stage:hover .tile img{filter:saturate(1.02) contrast(1.02) brightness(1);}

  .t-a{grid-area:a;} .t-b{grid-area:b;} .t-c{grid-area:c;} .t-d{grid-area:d;} .t-e{grid-area:e;}
  .t-f{grid-area:f;} .t-g{grid-area:g;} .t-h{grid-area:h;} .t-i{grid-area:i;} .t-j{grid-area:j;}

  .tile:nth-child(1){animation-delay:.05s} .tile:nth-child(2){animation-delay:.13s}
  .tile:nth-child(3){animation-delay:.21s} .tile:nth-child(4){animation-delay:.29s}
  .tile:nth-child(5){animation-delay:.37s} .tile:nth-child(6){animation-delay:.45s}
  .tile:nth-child(7){animation-delay:.53s} .tile:nth-child(8){animation-delay:.61s}
  .tile:nth-child(9){animation-delay:.69s} .tile:nth-child(10){animation-delay:.77s}

  /* ---------- Scrim så texten alltid är läsbar ---------- */
  .scrim{
    position:absolute; inset:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 70% 56% at 50% 50%, rgba(10,8,7,.8) 0%, rgba(10,8,7,.5) 42%, rgba(10,8,7,.18) 74%, rgba(10,8,7,.4) 100%),
      linear-gradient(180deg, rgba(10,8,7,.72) 0%, rgba(10,8,7,.12) 26%, rgba(10,8,7,.16) 68%, rgba(10,8,7,.78) 100%);
    transition:opacity 1.2s ease;
  }
  .stage:hover .scrim{opacity:.88;}

  /* ---------- Innehåll ---------- */
  .content{
    position:relative; z-index:2;
    height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    padding:calc(env(safe-area-inset-top,0px) + 28px) 24px calc(env(safe-area-inset-bottom,0px) + 28px);
    pointer-events:none;
  }

  .kicker{
    display:flex; align-items:center; gap:14px;
    font-size:clamp(.6rem,1.4vw,.72rem);
    font-weight:500;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--dim);
    margin-bottom:clamp(18px,3.2vh,34px);
    opacity:0;
    animation:riseIn 1.1s cubic-bezier(.2,.75,.3,1) .5s both;
  }
  .kicker::before,.kicker::after{
    content:""; display:block;
    width:clamp(20px,5vw,54px); height:1px;
    background:linear-gradient(90deg,transparent,rgba(247,244,238,.6));
  }
  .kicker::after{background:linear-gradient(90deg,rgba(247,244,238,.6),transparent);}

  h1{
    margin:0;
    font-family:'Playfair Display',Georgia,serif;
    font-weight:700;
    font-size:clamp(3.4rem,11.5vw,9rem);
    line-height:.94;
    letter-spacing:.005em;
    text-shadow:0 4px 60px rgba(0,0,0,.6), 0 1px 3px rgba(0,0,0,.4);
    opacity:0;
    animation:riseIn 1.3s cubic-bezier(.2,.75,.3,1) .62s both;
  }
  h1 .resa{
    display:block;
    font-weight:400;
    font-style:italic;
    color:rgba(247,244,238,.93);
  }

  .year{
    display:flex; align-items:center; gap:clamp(14px,3vw,30px);
    margin-top:clamp(16px,2.6vh,28px);
    font-family:'Playfair Display',Georgia,serif;
    font-size:clamp(1.05rem,2.6vw,1.7rem);
    font-weight:500;
    letter-spacing:.52em;
    padding-left:.52em;
    color:var(--paper);
    opacity:0;
    animation:riseIn 1.2s cubic-bezier(.2,.75,.3,1) .78s both;
  }
  .year::before,.year::after{
    content:""; display:block;
    width:clamp(34px,9vw,110px); height:1px;
    background:rgba(247,244,238,.45);
  }

  .places{
    margin:clamp(22px,4vh,42px) 0 0;
    font-size:clamp(.66rem,1.55vw,.82rem);
    font-weight:400;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--dim);
    max-width:90vw;
    line-height:2;
    opacity:0;
    animation:riseIn 1.2s cubic-bezier(.2,.75,.3,1) .92s both;
    pointer-events:auto;
  }
  .places .dot{color:var(--vermilion); margin:0 .5em;}
  .places a{
    color:inherit;
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:color .25s ease, border-color .25s ease;
    padding:.3em 0;
  }
  .places a:hover, .places a:focus-visible{
    color:var(--paper);
    border-color:var(--vermilion);
  }

  .cta{
    display:inline-flex; align-items:center; gap:12px;
    margin-top:clamp(26px,4.4vh,46px);
    padding:14px 30px;
    border:1px solid rgba(247,244,238,.45);
    border-radius:999px;
    background:rgba(12,10,9,.28);
    backdrop-filter:blur(6px);
    font-size:.78rem; font-weight:500;
    letter-spacing:.2em; text-transform:uppercase;
    color:var(--paper);
    transition:background .35s ease, color .35s ease, border-color .35s ease, transform .35s ease;
    opacity:0;
    animation:riseIn 1.2s cubic-bezier(.2,.75,.3,1) 1.06s both;
  }
  .cta .arrow{transition:transform .35s ease;}
  .stage:hover .cta{
    background:var(--paper); color:var(--ink);
    border-color:var(--paper); transform:translateY(-2px);
  }
  .stage:hover .cta .arrow{transform:translateX(5px);}

  /* Vertikalt japanskt accenttecken */
  .kanji{
    position:absolute;
    right:clamp(18px,3.2vw,52px);
    top:50%;
    transform:translateY(-50%);
    z-index:2;
    writing-mode:vertical-rl;
    font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
    font-size:clamp(1.4rem,3vw,2.5rem);
    letter-spacing:.34em;
    color:rgba(247,244,238,.22);
    pointer-events:none;
    opacity:0;
    animation:fadeIn 1.6s ease 1.25s both;
  }

  .footnote{
    position:absolute;
    left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    z-index:2;
    font-size:.66rem;
    letter-spacing:.26em;
    text-transform:uppercase;
    color:rgba(247,244,238,.42);
    pointer-events:none;
    opacity:0;
    animation:fadeIn 1.6s ease 1.5s both;
  }

  /* ---------- Rörelse ---------- */
  @keyframes tileIn{
    from{opacity:0; transform:scale(1.04) translateY(14px); filter:blur(6px);}
    to{opacity:1; transform:none; filter:blur(0);}
  }
  @keyframes riseIn{
    from{opacity:0; transform:translateY(22px);}
    to{opacity:1; transform:none;}
  }
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  @keyframes driftA{
    from{transform:scale(1.09) translate3d(-1.2%,-1%,0);}
    to{transform:scale(1.16) translate3d(1.4%,1.2%,0);}
  }
  @keyframes driftB{
    from{transform:scale(1.14) translate3d(1.3%,1%,0);}
    to{transform:scale(1.08) translate3d(-1.3%,-1.1%,0);}
  }

  /* ---------- Responsivt ---------- */
  @media (max-width:900px){
    .mosaic{
      grid-template-columns:repeat(4,1fr);
      grid-template-rows:repeat(6,1fr);
      grid-template-areas:
        "a a b c"
        "a a b c"
        "d e e f"
        "d e e f"
        "g g h i"
        "j j h i";
    }
    .kanji{display:none;}
  }
  @media (max-width:560px){
    .mosaic{
      grid-template-columns:repeat(2,1fr);
      grid-template-rows:repeat(8,1fr);
      grid-template-areas:
        "a a"
        "a a"
        "b c"
        "b c"
        "d e"
        "f e"
        "g h"
        "i j";
    }
    .scrim{
      background:
        radial-gradient(ellipse 128% 40% at 50% 48%, rgba(10,8,7,.93) 0%, rgba(10,8,7,.8) 48%, rgba(10,8,7,.34) 82%, rgba(10,8,7,.5) 100%),
        linear-gradient(180deg, rgba(10,8,7,.62) 0%, rgba(10,8,7,.18) 24%, rgba(10,8,7,.22) 70%, rgba(10,8,7,.78) 100%);
    }
    .places{font-size:.6rem; letter-spacing:.14em; line-height:1.9;}
    .places .dot{margin:0 .35em;}
    .footnote{display:none;}
  }

  @media (prefers-reduced-motion:reduce){
    .tile,.kicker,h1,.year,.places,.cta,.kanji,.footnote{animation:none !important; opacity:1 !important;}
    .tile img{animation:none !important; transform:scale(1.02);}
  }
</style>
</head>
<body>

<div class="stage" id="stage" role="link" tabindex="0" aria-label="Öppna Japanresan 2026 – resplan, boende och praktisk info">

  <div class="mosaic" aria-hidden="true">
    <figure class="tile t-a"><img src="img/fushimi-torii-tunnel.jpg" alt="" decoding="async"></figure>
    <figure class="tile t-b"><img src="img/tokyo-sensoji.jpg" alt="" decoding="async"></figure>
    <figure class="tile t-c"><img src="img/tokyo-neon.jpg" alt="" decoding="async"></figure>
    <figure class="tile t-d"><img src="img/gion-maiko.jpg" alt="" decoding="async"></figure>
    <figure class="tile t-e"><img src="img/wazuka-tea.jpg" alt="" decoding="async"></figure>
    <figure class="tile t-f"><img src="img/kanazawa-kenrokuen.jpg" alt="" decoding="async"></figure>
    <figure class="tile t-g"><img src="img/kyoto-bamboo.jpg" alt="" decoding="async"></figure>
    <figure class="tile t-h"><img src="img/kanazawa-chaya.jpg" alt="" decoding="async"></figure>
    <figure class="tile t-i"><img src="img/hakone-ashi-fuji.jpg" alt="" decoding="async"></figure>
    <figure class="tile t-j"><img src="img/kyoto-kiyomizu.jpg" alt="" decoding="async"></figure>
  </div>

  <div class="scrim"></div>

  <span class="kanji">日本</span>

  <div class="content">
    <span class="kicker">1 – 14 november</span>
    <h1>Japan<span class="resa">resa</span></h1>
    <span class="year">2026</span>
    <p class="places">
      <a href="highlights.html#tokyo">Tokyo</a> <span class="dot">·</span>
      <a href="highlights.html#kanazawa">Kanazawa</a> <span class="dot">·</span>
      <a href="highlights.html#kyoto">Kyoto</a> <span class="dot">·</span>
      <a href="highlights.html#wazuka">Wazuka</a> <span class="dot">·</span>
      <a href="highlights.html#hakone">Hakone</a>
    </p>
    <span class="cta">Öppna resan <span class="arrow">→</span></span>
  </div>

  <span class="footnote">Klicka var som helst</span>

</div>

<script>
  const stage = document.getElementById('stage');
  function goToTrip(e) {
    if (e.target.closest('a')) return; // låt stadslänkarna sköta sig själva
    window.location.href = 'japan.html';
  }
  stage.addEventListener('click', goToTrip);
  stage.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('a')) {
      e.preventDefault();
      window.location.href = 'japan.html';
    }
  });
</script>

</body>
</html>
