name: Sync Polar Health Data

on:
  schedule:
    - cron: "0 5 * * *" # daily at 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: polar-health-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Pull latest Polar data
        env:
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_USER_ID: ${{ secrets.POLAR_USER_ID }}
        run: python3 health/scripts/pull_polar_data.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add health/data
          if git diff --cached --quiet; then
            echo "No new health data."
          else
            git commit -m "Update Polar health data ($(date -u +%Y-%m-%d))"
            git push
          fi
